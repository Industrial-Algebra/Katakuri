name: Docs

# mdBook deploy on version tags (Netlify builds via netlify.toml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  book:
    name: Build book (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/
      - run: mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/book/
